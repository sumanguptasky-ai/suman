<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - eSewa Payment</title>
    <!-- jsQR Library for QR Scanner -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            max-width: 650px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #60bb46;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #60bb46;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .radio-option input {
            accent-color: #60bb46;
        }
        .fee-badge {
            background-color: #eafaf1;
            border: 1px solid #60bb46;
            color: #278617;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .payment-section {
            border: 2px dashed #60bb46;
            background: #f9fdf9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .esewa-title {
            color: #60bb46;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .qr-placeholder {
            width: 180px;
            height: 180px;
            border: 2px dashed #bbb;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 8px;
            position: relative;
           
        }
        .qr-placeholder img {
            width: 100%;
            height: 100%;
           
        }
        .scanner-section {
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 240px;
            margin: 10px auto;
            display: none;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn {
            background-color: #60bb46;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #4ea236;
        }
        .btn-scan {
            background-color: #007bff;
            margin-bottom: 10px;
        }
        .btn-scan:hover {
            background-color: #0056b3;
        }
        .scan-msg {
            font-size: 13px;
            color: #278617;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>GNS selection form</h1>
        <p>created by suman kumar gupta</p>
    </div>

    <!-- ipl Fee Info -->
    <div class="fee-badge">
        selectio Fee: NPR 20
    </div>

    <form action="https://formspree.io/f/xjyyjowp" method="post">
        
        <!-- Full Name -->
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <!-- Email Address -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required>
        </div>

        <!-- Mobile Number -->
        <div class="form-group">
            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" name="phone" placeholder="98XXXXXXXX" pattern="[0-9]{10}" required>
        </div>

        <!-- Institution Type Selection (School / College) -->
        <div class="form-group">
            <label>Institution Type</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="institution_type" value="national" checked onclick="toggleInstitutionLabel()"> national
                </label>
                <label class="radio-option">
                    <input type="radio" name="institution_type" value="international" onclick="toggleInstitutionLabel()"> international
                </label>
            </div>
        </div>

        <!-- Institution Name -->
        <div class="form-group">
            <label id="instLabel" for="institution_name">what is your playing Role</label>
            <input type="text" id="institution_name" name="institution_name" placeholder="batsman/bowler/allrounder" required>
        </div>

        <!-- eSewa Payment QR Section -->
        <div class="payment-section">
            <div class="esewa-title">eSewa Payment Scan</div>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Scan this eSewa QR code to pay NPR 20</p>
            
            <div class="qr-placeholder"> 
                <!-- Replace 'your-esewa-qr.png' with your scanner image file link -->
                <img src="scanner.jpeg" width="150">
            </div>
            
            <small style="color: #888;">(Please payment required amount)</small>
        </div>

        <!-- Camera Scanner Section -->
        <div class="scanner-section">
            <label>Scan Receipt / Transaction QR</label>
            <button type="button" class="btn btn-scan" id="startCamBtn" onclick="toggleCamera()">Open Camera Scanner</button>
            
            <div id="video-container">
                <video id="webcam" playsinline></video>
            </div>
            <div id="scanStatus" class="scan-msg"></div>

            <p style="font-size: 12px; color: #777; margin-top: 8px;">OR upload payment screenshot/QR file:</p>
            <input type="file" id="qrFileInput" accept="image/*" style="margin-top: 5px;" onchange="scanImageFile(event)">
        </div>

        <!-- Transaction ID -->
        <div class="form-group">
            <label for="transaction_id">eSewa Transaction ID / Reference Code</label>
            <input type="text" id="transaction_id" name="transaction_id" placeholder="Enter or scan your transaction ID" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn">Submit Registration</button>

    </form>
</div>

<script>
    // Toggle Institution Label (School vs College)
    function toggleInstitutionLabel() {
        const type = document.querySelector('input[name="institution_type"]:checked').value;
        const label = document.getElementById('instLabel');
        const input = document.getElementById('institution_name');
        
        if (type === 'College') {
            label.innerText = 'College Name';
            input.placeholder = 'Enter your college name';
        } else {
            label.innerText = 'School Name';
            input.placeholder = 'Enter your school name';
        }
    }

    // Camera Scanner Logic using jsQR
    let video = document.getElementById('webcam');
    let videoContainer = document.getElementById('video-container');
    let scanning = false;
    let stream = null;

    async function toggleCamera() {
        const btn = document.getElementById('startCamBtn');
        const status = document.getElementById('scanStatus');

        if (!scanning) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                videoContainer.style.display = "block";
                scanning = true;
                btn.innerText = "Close Camera";
                btn.style.backgroundColor = "#dc3545";
                status.innerText = "Scanning... Place QR code in front of camera";
                requestAnimationFrame(scanFrame);
            } catch (err) {
                alert("Camera access failed: " + err.message);
            }
        } else {
            stopCamera();
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        videoContainer.style.display = "none";
        scanning = false;
        document.getElementById('startCamBtn').innerText = "Open Camera Scanner";
        document.getElementById('startCamBtn').style.backgroundColor = "#007bff";
    }

    function scanFrame() {
        if (!scanning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            let canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            let ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let code = jsQR(imageData.data, imageData.width, imageData.height);

            if (code) {
                document.getElementById('transaction_id').value = code.data;
                document.getElementById('scanStatus').innerText = "Scanned Successfully: " + code.data;
                stopCamera();
                return;
            }
        }
        requestAnimationFrame(scanFrame);
    }

    // Scan Uploaded Image File
    function scanImageFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, img.width, img.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    document.getElementById('transaction_id').value = code.data;
                    document.getElementById('scanStatus').innerText = "Scanned from image: " + code.data;
                } else {
                    alert("Could not detect a QR code from this image.");
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Form Submit Event
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Form submitted successfully!');
    });
</script>

</body>
</html>
